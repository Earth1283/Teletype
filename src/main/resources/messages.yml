# Teletype Plugin Messages
# Format: MiniMessage — https://docs.advntr.dev/minimessage/format
# Available placeholders depend on the message; see comments on each key.
# {prefix} is always available and resolved from the prefix key below.
# To disable a message entirely, set it to an empty string: ""

prefix: "<bold><aqua>Teletype</aqua></bold> <dark_gray>»</dark_gray> "

# ── Lifecycle (console-only) ─────────────────────────────────────────────────
# {version} {url}
startup: "{prefix}<green>v{version} ready <dark_gray>—</dark_gray> <white>{url}</white> <dark_gray>·</dark_gray> <gray>/tty help"
# (no placeholders)
shutdown: "{prefix}<yellow>stopped"

# ── /tty command ─────────────────────────────────────────────────────────────
command:
  # {input} {label}
  unknown-subcommand: "{prefix}<red>Unknown subcommand <white>{input}</white>. <gray>Run <aqua>/{label} help</aqua> to see every command."
  # {command} — clickable, fills the suggestion into chat
  did-you-mean: "{prefix}<gray>Did you mean <aqua><u>{command}</u></aqua>?"

  help:
    # {version} {port} {state}
    header: "{prefix}<white><bold>Commands</bold></white> <dark_gray>·</dark_gray> <gray>v{version}, web panel {state} on port {port}"
    # {command} {usage} — the description below is appended, and the whole line is clickable
    entry: "  <aqua>{command}</aqua> <gray>{usage}</gray> <dark_gray>— "
    # {command}
    hover: "<gray>Click to put <aqua>{command}</aqua> in chat"
    # {label}
    footer: "<dark_gray>Click a command to fill it in. <gray>/{label} help</gray> followed by a command name explains it in detail."
    admin-only: "<dark_gray>You need to be a Teletype admin to run this one."
    descriptions:
      help: "<white>Show this list, or details for one command"
      status: "<white>Show whether the web panel is running"
      verify: "<white>Approve a web login with the code from the browser"
      start: "<white>Start the web panel"
      stop: "<white>Stop the web panel"
      reload: "<white>Reload config.yml and messages.yml, then restart the panel"
      doctor: "<white>Check ports, files, TLS and security settings"
      revoke: "<white>Log out every web session"
    # {label}
    details:
      help: "<gray>Lists every <aqua>/{label}</aqua> command you can run. Add a command name for details, e.g. <aqua>/{label} help verify</aqua>."
      status: "<gray>Prints whether the embedded web server is running and which port it listens on."
      verify: "<gray>Open the panel in a browser, copy the code it shows, then run <aqua>/{label} verify</aqua> followed by that code here. The browser logs in as you, and everything it does is recorded under your name in the audit log.<newline><yellow>Only approve codes you just opened yourself.</yellow>"
      start: "<gray>Starts the web server if it was stopped with <aqua>/{label} stop</aqua>."
      stop: "<gray>Stops the web server. Metrics, schedules and port forwards keep running."
      reload: "<gray>Re-reads config.yml and messages.yml and restarts the web server if it was running. Some settings (metrics sampling, the multiplexer) still need a full server restart."
      doctor: "<gray>Runs a health check: web assets, ports, TLS keystore, JWT secret, data files and security guards. Each line is PASS, WARN or FAIL."
      revoke: "<gray>Generates a new signing secret, which invalidates every issued login and download link, and disconnects open consoles. Everyone has to <aqua>/{label} verify</aqua> again."
  no-permission: "{prefix}<red>No permission."

  verify:
    no-permission: "{prefix}<red>Only console or Teletype admins (operators when auth.require-op is true) can verify challenges."
    teletype-denied: "{prefix}<red>For security, <white>/tty verify</white><red> cannot be run from Teletype. Use the real server console or an operator in-game."
    player-denied: "{prefix}<red>For security, players cannot run <white>/tty verify</white><red>. Use the real server console."
    # {player_ip} {http_ip}
    player-ip-mismatch: "{prefix}<red>For security, player verify requires matching IPs. <gray>Player: <white>{player_ip}</white> <dark_gray>|</dark_gray> HTTP: <white>{http_ip}</white>"
    usage: "{prefix}<red>Usage: <gray>/tty verify [uuid]"
    invalid-uuid: "{prefix}<red>Invalid UUID format."
    # (no placeholders)
    success: "{prefix}<green>Challenge verified. JWT issued to the waiting client."
    # (no placeholders)
    not-found: "{prefix}<red>Challenge not found or already expired."

  status:
    # {port}
    running: "{prefix}<green>Web server running on port <white>{port}"
    stopped: "{prefix}<red>Web server is stopped."

  start:
    already-running: "{prefix}<yellow>Web server is already running."
    progress: "{prefix}<gray>Starting web server..."
    success: "{prefix}<green>Web server started."
    # {error}
    failed: "{prefix}<red>Failed to start web server: <white>{error}"

  revoke:
    # (no placeholders)
    success: "{prefix}<green>All web sessions revoked. Everyone must log in again with <white>/tty verify</white><green>."

  stop:
    not-running: "{prefix}<yellow>Web server is not running."
    progress: "{prefix}<gray>Stopping web server..."
    success: "{prefix}<yellow>Web server stopped."
    # {error}
    failed: "{prefix}<red>Failed to stop web server: <white>{error}"

  reload:
    progress: "{prefix}<gray>Reloading configuration..."
    # {state}
    success: "{prefix}<green>Configuration reloaded; <white>{state}<green>. <gray>Startup-only subsystem changes require a full server restart."
    # {error}
    failed: "{prefix}<red>Reload failed: <white>{error}"

# ── TLS (console-only) ───────────────────────────────────────────────────────
tls:
  # {path}
  generating: "{prefix}<gray>Generating self-signed certificate <dark_gray>→</dark_gray> <white>{path}"
  cert-created: "{prefix}<gray>Self-signed cert created. <yellow>Browsers will warn — accept once."
  production-hint: "{prefix}<gray>For production, use <white>server.tls.mode: keystore</white> in config.yml"

# ── Metrics retention (console-only) ─────────────────────────────────────────
metrics:
  retention-start: "{prefix}<gray>Running nightly metrics retention…"
  retention-done: "{prefix}<gray>Metrics retention complete."
  # {error}
  retention-failed: "{prefix}<red>Retention job failed: <white>{error}"

# ── Data file errors (console-only) ──────────────────────────────────────────
data:
  # {error}
  snippets-load-failed: "{prefix}<red>Failed to load snippets.json: <white>{error}<red>. Seeding defaults."
  # {error}
  schedule-load-failed: "{prefix}<red>Failed to load schedule.json: <white>{error}"
